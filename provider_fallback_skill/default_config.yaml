module: skills.provider_fallback.main
name: ProviderFallback
api_version: 3
version: 0.4.4
display_name: Provider fallback
author: Star Citizen Computer contributors
description:
  en: Optional local OpenAI-compatible inference bridge with ordered provider routes.
hint:
  en: Ask your Wingman to open provider fallback setup. Choose providers and models, review, apply and activate. Nothing changes until you apply. API calls may be billable.
auto_activate: true
discoverable_by_default: false
custom_properties:
  - id: setup_core_port
    name: Wingman Core API port (advanced)
    hint: Keep the default unless your Wingman Core API uses another port. This is only used when you open setup.
    property_type: number
    value: 49111
    required: false
  - id: main_enabled
    name: Enable Main fallback
    hint: Enable the configured Main chain; API routes may incur charges.
    property_type: boolean
    value: false
    required: false
  - id: listen_port
    name: Loopback port
    property_type: number
    value: 4141
    required: true
  - id: bridge_secret_name
    name: Existing bridge bearer secret name
    property_type: string
    value: ""
    required: true
  - id: routes_json
    name: Ordered provider routes JSON
    hint: Ordered route_id, endpoint, model, secret_name, request_overrides, final_local, wire_protocol and optional jev_assist. Jev can add latency or reduce accuracy; leave off unless your tasks benefit.
    property_type: string
    value: "[]"
    required: true
  - id: fallback_mode
    name: Automatic fallback
    property_type: single_select
    options:
      - label: Credit exhaustion only (recommended)
        value: credits_only
      - label: Provider availability
        value: availability
      - label: Manual only
        value: manual
    value: credits_only
    required: false
  - id: notify_switches
    name: Notify when provider changes
    property_type: boolean
    value: true
    required: false
  - id: support_enabled
    name: Enable Support fallback
    hint: Enable the configured Support chain; API routes may incur charges.
    property_type: boolean
    value: false
    required: false
  - id: support_listen_port
    name: Support loopback port
    property_type: number
    value: 4142
    required: false
  - id: support_routes_json
    name: Ordered Support routes JSON
    property_type: string
    value: "[]"
    required: false
  - id: support_fallback_mode
    name: Support automatic fallback
    property_type: single_select
    options:
      - label: Credit exhaustion only (recommended)
        value: credits_only
      - label: Provider availability
        value: availability
      - label: Manual only
        value: manual
    value: credits_only
    required: false
