module: skills.provider_fallback.main
name: ProviderFallback
api_version: 3
version: 0.2.0
display_name: Provider fallback
author: Star Citizen Computer contributors
description:
  en: Optional local OpenAI-compatible inference bridge with ordered provider routes.
hint:
  en: Configure routes and existing secret names, then start the bridge before selecting its loopback endpoint in Wingman. Provider calls may be billable.
auto_activate: true
discoverable_by_default: false
custom_properties:
  - id: listen_port
    name: Loopback port
    property_type: number
    value: 4141
    required: true
  - id: bridge_secret_name
    name: Existing bridge bearer secret name
    property_type: string
    value: ""
    required: true
  - id: routes_json
    name: Ordered provider routes JSON
    hint: Ordered route_id, endpoint, model, secret_name, request_overrides, final_local, wire_protocol and optional jev_assist. Jev can add latency or reduce accuracy; leave off unless your tasks benefit.
    property_type: string
    value: "[]"
    required: true
  - id: fallback_mode
    name: Automatic fallback
    property_type: single_select
    options:
      - label: Credit exhaustion only (recommended)
        value: credits_only
      - label: Provider availability
        value: availability
      - label: Manual only
        value: manual
    value: credits_only
    required: false
  - id: notify_switches
    name: Notify when provider changes
    property_type: boolean
    value: true
    required: false
